<body>

<!-- START SCREEN -->
<div id="start-text-ring">
  <svg id="text-ring-svg" viewBox="0 0 300 300">
    <defs>
      <path
        id="text-circle"
        d="M 150,150
           m -120,0
           a 120,120 0 1,1 240,0
           a 120,120 0 1,1 -240,0" />
    </defs>


    <text>
      <textPath href="#text-circle" startOffset="0%">
        PETER KOPP PHOTOGRAPHY      • PETER KOPP PHOTOGRAPHY •
      </textPath>
    </text>
  </svg>
</div>
<!-- HUD HINTS -->
<div id="hud-hints">
  <div class="hud-hint">Drag to rotate the gallery</div>
  <div class="hud-hint">Click any photo to view it full size</div>
  <div class="hud-hint">Click the center sphere for more information</div>
</div>
